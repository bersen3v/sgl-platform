user  nginx;
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:8000;
    }

    # Основной сервер для www
    server {
        listen 80;
        listen 443 ssl http2;
        server_name www.sglone.kz sglone.kz;
        
        # SSL конфигурация только для HTTPS
        if ($scheme = http) {
            return 301 https://www.sglone.kz$request_uri;
        }
        
        ssl_certificate /etc/letsencrypt/live/www.sglone.kz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.sglone.kz/privkey.pem;

        # Переадресация с домена без www на домен с www
        if ($host = sglone.kz) {
            return 301 https://www.sglone.kz$request_uri;
        }

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }
        }

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
            default_type "text/plain";
            try_files $uri =404;
        }
    }

    # Отдельный сервер для перехвата ACME challenges без www
    server {
        listen 80;
        server_name sglone.kz;
        
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
            default_type "text/plain";
            try_files $uri =404;
        }
        
        # Все остальные запросы перенаправляем на www
        location / {
            return 301 https://www.sglone.kz$request_uri;
        }
    }
}
networks: 
  dev:
services:
  nginx: 
    image: nginx:stable-alpine
    ports: 
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on: 
      - backend
      - frontend
    networks:
      - dev

  backend: 
    build: 
      context: ../backend
    networks:
      - dev
  
  frontend: 
    build: 
      context: ../frontend
    networks:
      - dev
  
  certbot:
    image: certbot/certbot
    depends_on:
      - nginx
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    command: certonly --webroot -w /var/www/certbot --force-renewal --email bersenev4dev@gmail.com -d www.sglone.kz --agree-tos